# WhatsAppMan site — CI/CD.
#
# Runs on the server7 shell runner (as gitlab-runner) but DEPLOYS + runs PM2 as
# the ISPConfig shell user `whatsappman` — the same pattern as every persistent
# app on this host (mailman, phase4, …). Processes owned by gitlab-runner get
# reaped by logind KillUserProcesses; the web shell user (with linger) survives.
#
# Flow: bootstrap the runner's key into the shell user (via SHELL_PW once) →
# rsync site/ over ssh → build + migrate + seed + PM2 as the shell user.
# .env is generated from CI/CD variables. Masked CI vars: SENDGRID_API_KEY,
# PGPASSWORD, SHELL_PW.

stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - node
    - server7
  interruptible: true
  resource_group: whatsappman-site
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      command -v sshpass >/dev/null || { echo "ERROR: sshpass not available on runner"; exit 1; }
      SHELL_USER=whatsappman
      REMOTE=127.0.0.1
      PORT="${SERVER_PORT:-50121}"
      SSHOPT="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      # 1) bootstrap the runner's SSH key into the shell user (idempotent)
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
      PUB="$(cat ~/.ssh/id_ed25519.pub)"
      sshpass -p "$SHELL_PW" ssh $SSHOPT "$SHELL_USER@$REMOTE" \
        "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && grep -qF '$PUB' ~/.ssh/authorized_keys || echo '$PUB' >> ~/.ssh/authorized_keys"

      # 2) generate .env from CI/CD variables (job context has them)
      cat > deploy.env <<EOF
      NODE_ENV=production
      APP_VERSION=${CI_COMMIT_SHORT_SHA}
      SERVER_PORT=${PORT}
      PGHOST=${PGHOST:-127.0.0.1}
      PGPORT=${PGPORT:-5433}
      PGUSER=${PGUSER:-whatsappman}
      PGPASSWORD=${PGPASSWORD}
      PGDATABASE=${PGDATABASE:-whatsappman_site}
      SENDGRID_API_KEY=${SENDGRID_API_KEY}
      MAIL_FROM_EMAIL=no-reply@whatsappman.indianic.dev
      MAIL_FROM_NAME=WhatsAppMan
      MAIL_LEADS_INBOX=hello@whatsappman.indianic.dev
      SITE_NAME=WhatsAppMan
      SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      SITE_TAGLINE=Send WhatsApp messages from any AI tool — safely.
      NPM_PACKAGE=@indianic/whatsappman
      NPM_URL=https://npm.indianic.in/-/web/detail/@indianic/whatsappman
      VITE_API_BASE=/api
      VITE_SITE_NAME=WhatsAppMan
      VITE_SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      VITE_SITE_TAGLINE=Send WhatsApp messages from any AI tool — safely.
      VITE_NPM_PACKAGE=@indianic/whatsappman
      VITE_NPM_URL=https://npm.indianic.in/-/web/detail/@indianic/whatsappman
      VITE_CONTACT_EMAIL=hello@whatsappman.indianic.dev
      EOF

      # 3) sync code + env to the shell user's home (over ssh, key auth now works)
      ssh $SSHOPT "$SHELL_USER@$REMOTE" "mkdir -p ~/whatsappman-site"
      rsync -a --delete -e "ssh $SSHOPT" \
        --exclude=.git --exclude=node_modules --exclude=client/node_modules --exclude=client/dist --exclude=.env \
        ./site/ "$SHELL_USER@$REMOTE:whatsappman-site/"
      scp $SSHOPT deploy.env "$SHELL_USER@$REMOTE:whatsappman-site/.env"

      # 4) build + run PM2 AS the shell user (survives — linger + web user)
      ssh $SSHOPT "$SHELL_USER@$REMOTE" bash -s <<'REMOTE_EOF'
      set -e
      loginctl enable-linger 2>/dev/null || true
      source "$HOME/.nvm/nvm.sh" 2>/dev/null || true
      export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ 2>/dev/null | sort -V | tail -1)/bin:$HOME/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
      command -v node >/dev/null || { echo "NODE_MISSING on shell user"; exit 1; }
      command -v pm2 >/dev/null || npm install -g pm2
      cd ~/whatsappman-site
      npm install --no-audit --no-fund
      npm run build
      npm run migrate
      npm run seed
      pm2 delete whatsappman-site 2>/dev/null || true
      APP_NAME=whatsappman-site pm2 start ecosystem.config.cjs
      pm2 save
      sleep 3
      pm2 list
      echo "--- local health ---"
      curl -sS -m 6 http://127.0.0.1:50121/api/health && echo "" || echo "LOCAL_HEALTH_FAILED"
      REMOTE_EOF
      echo "Deployed as $SHELL_USER (persistent web user + linger)."
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
