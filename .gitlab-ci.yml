# WhatsAppMan site — CI/CD.
#
# Runs on the server7 SHELL runner (executes directly on the server), so no SSH
# hop / deploy key is needed. Strategy: check out the whole repo, then build and
# run ONLY the `site/` subfolder under PM2 on $SERVER_PORT. ISPConfig reverse-
# proxies whatsappman.indianic.dev → 127.0.0.1:$SERVER_PORT.
#
# Runtime config (.env) is generated each run from GitLab CI/CD variables, so
# nothing secret lives in the repo. Secrets set as masked CI variables:
#   SENDGRID_API_KEY, PGPASSWORD
# Others fall back to sensible defaults but can be overridden via CI variables.

stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - node
    - server7
  interruptible: true
  resource_group: whatsappman-site
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      # --- node/pm2 on PATH (nvm) ---
      source "$HOME/.nvm/nvm.sh" 2>/dev/null || true
      export PATH="$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node/" 2>/dev/null | sort -V | tail -1)/bin:$HOME/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
      command -v node >/dev/null || { echo "ERROR: node not found on runner"; exit 1; }
      command -v pm2  >/dev/null || npm install -g pm2

      APP_NAME="${APP_NAME:-whatsappman-site}"
      PORT="${SERVER_PORT:-50121}"

      cd site

      # --- generate site/.env from CI variables (dynamic; no secrets in repo) ---
      cat > .env <<EOF
      NODE_ENV=production
      SERVER_PORT=${PORT}
      PGHOST=${PGHOST:-127.0.0.1}
      PGPORT=${PGPORT:-5433}
      PGUSER=${PGUSER:-whatsappman}
      PGPASSWORD=${PGPASSWORD}
      PGDATABASE=${PGDATABASE:-whatsappman_site}
      SENDGRID_API_KEY=${SENDGRID_API_KEY}
      MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-no-reply@whatsappman.indianic.dev}
      MAIL_FROM_NAME=${MAIL_FROM_NAME:-WhatsAppMan}
      MAIL_LEADS_INBOX=${MAIL_LEADS_INBOX:-hello@whatsappman.indianic.dev}
      SITE_NAME=${SITE_NAME:-WhatsAppMan}
      SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      SITE_TAGLINE=${SITE_TAGLINE:-Send WhatsApp messages from any AI tool — safely.}
      NPM_PACKAGE=${NPM_PACKAGE:-@indianic/whatsappman}
      NPM_URL=${NPM_URL:-https://npm.indianic.in/-/web/detail/@indianic/whatsappman}
      VITE_API_BASE=/api
      VITE_SITE_NAME=${SITE_NAME:-WhatsAppMan}
      VITE_SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      VITE_SITE_TAGLINE=${SITE_TAGLINE:-Send WhatsApp messages from any AI tool — safely.}
      VITE_NPM_PACKAGE=${NPM_PACKAGE:-@indianic/whatsappman}
      VITE_NPM_URL=${NPM_URL:-https://npm.indianic.in/-/web/detail/@indianic/whatsappman}
      VITE_CONTACT_EMAIL=${MAIL_LEADS_INBOX:-hello@whatsappman.indianic.dev}
      EOF

      # --- install + build (server deps, then client build) ---
      npm install --no-audit --no-fund
      npm run build

      # --- database: create schema + seed templates (both idempotent) ---
      npm run migrate
      npm run seed

      # --- (re)start under PM2 on $PORT ---
      pm2 delete "$APP_NAME" 2>/dev/null || true
      APP_NAME="$APP_NAME" pm2 start ecosystem.config.cjs
      pm2 save
      echo "Deployed $APP_NAME on 127.0.0.1:${PORT} (cwd $(pwd))"
      # --- post-start diagnostics ---
      sleep 4
      pm2 list || true
      echo "--- local health probe ---"
      curl -sS -m 6 "http://127.0.0.1:${PORT}/api/health" && echo "" || echo "LOCAL_HEALTH_FAILED"
      echo "--- recent app logs ---"
      pm2 logs "$APP_NAME" --lines 40 --nostream || true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
