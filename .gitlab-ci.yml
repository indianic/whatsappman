# WhatsAppMan site — CI/CD.
#
# Runs on the server7 shell runner. To keep PM2 alive after the job ends (the
# runner reaps job-spawned processes — even setsid'd ones), the actual start
# happens inside an `ssh localhost` session: sshd-spawned processes reparent to
# init and live outside the runner's job cgroup. The app is deployed to a STABLE
# dir ($HOME/apps/whatsappman-site), not the ephemeral CI build dir.
#
# Runtime config (.env) is generated from GitLab CI/CD variables each run.
# Secrets (masked CI vars): SENDGRID_API_KEY, PGPASSWORD.

stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - node
    - server7
  interruptible: true
  resource_group: whatsappman-site
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      APP_NAME="${APP_NAME:-whatsappman-site}"
      PORT="${SERVER_PORT:-50121}"
      STABLE="$HOME/apps/whatsappman-site"
      mkdir -p "$STABLE"

      # 1) sync source into the stable dir (keep node_modules/.env across deploys)
      rsync -a --delete \
        --exclude='.git' --exclude='node_modules' --exclude='client/node_modules' \
        --exclude='client/dist' --exclude='.env' \
        ./site/ "$STABLE/"

      # 2) generate .env from CI variables (dynamic; no secrets in the repo)
      cat > "$STABLE/.env" <<EOF
      NODE_ENV=production
      APP_VERSION=${CI_COMMIT_SHORT_SHA}
      SERVER_PORT=${PORT}
      PGHOST=${PGHOST:-127.0.0.1}
      PGPORT=${PGPORT:-5433}
      PGUSER=${PGUSER:-whatsappman}
      PGPASSWORD=${PGPASSWORD}
      PGDATABASE=${PGDATABASE:-whatsappman_site}
      SENDGRID_API_KEY=${SENDGRID_API_KEY}
      MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-no-reply@whatsappman.indianic.dev}
      MAIL_FROM_NAME=${MAIL_FROM_NAME:-WhatsAppMan}
      MAIL_LEADS_INBOX=${MAIL_LEADS_INBOX:-hello@whatsappman.indianic.dev}
      SITE_NAME=${SITE_NAME:-WhatsAppMan}
      SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      SITE_TAGLINE=${SITE_TAGLINE:-Send WhatsApp messages from any AI tool — safely.}
      NPM_PACKAGE=${NPM_PACKAGE:-@indianic/whatsappman}
      NPM_URL=${NPM_URL:-https://npm.indianic.in/-/web/detail/@indianic/whatsappman}
      VITE_API_BASE=/api
      VITE_SITE_NAME=${SITE_NAME:-WhatsAppMan}
      VITE_SITE_DOMAIN=${SITE_DOMAIN:-https://whatsappman.indianic.dev}
      VITE_SITE_TAGLINE=${SITE_TAGLINE:-Send WhatsApp messages from any AI tool — safely.}
      VITE_NPM_PACKAGE=${NPM_PACKAGE:-@indianic/whatsappman}
      VITE_NPM_URL=${NPM_URL:-https://npm.indianic.in/-/web/detail/@indianic/whatsappman}
      VITE_CONTACT_EMAIL=${MAIL_LEADS_INBOX:-hello@whatsappman.indianic.dev}
      EOF

      # 3) remote deploy script — runs build + PM2 inside the ssh session
      cat > "$STABLE/.deploy-remote.sh" <<REMOTE
      set -e
      source "\$HOME/.nvm/nvm.sh" 2>/dev/null || true
      export PATH="\$HOME/.nvm/versions/node/\$(ls \$HOME/.nvm/versions/node/ 2>/dev/null | sort -V | tail -1)/bin:\$HOME/bin:\$HOME/.local/bin:/usr/local/bin:\$PATH"
      command -v pm2 >/dev/null || npm install -g pm2
      echo "===== PRE-DEPLOY STATE (why is it down?) ====="
      pm2 list 2>&1 || echo "pm2 daemon NOT running"
      pm2 describe "$APP_NAME" 2>&1 | grep -iE "status|restarts|uptime|unstable|script|exec cwd|error log|out log" || echo "no pm2 entry for $APP_NAME"
      echo "--- listeners on ${PORT} ---"; (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep ":${PORT}" || echo "NOTHING listening on ${PORT}"
      echo "--- node/pm2 processes ---"; ps -eo pid,ppid,etimes,rss,cmd 2>/dev/null | grep -iE "PM2 v|God Daemon|server/index|whatsappman" | grep -v grep || echo "no node/pm2 processes"
      echo "--- pm2 error log tail ---"; tail -n 50 \$HOME/.pm2/logs/${APP_NAME}-error*.log 2>/dev/null || echo "no error log"
      echo "--- pm2 daemon uptime / who ---"; ls -la \$HOME/.pm2/pm2.log 2>/dev/null; uptime 2>/dev/null || true
      echo "===== END PRE-DEPLOY STATE ====="
      cd "$STABLE"
      npm install --no-audit --no-fund
      npm run build
      npm run migrate
      npm run seed
      pm2 delete "$APP_NAME" 2>/dev/null || true
      APP_NAME="$APP_NAME" pm2 start ecosystem.config.cjs
      pm2 save
      sleep 3
      pm2 list
      echo "--- local health ---"
      curl -sS -m 6 "http://127.0.0.1:${PORT}/api/health" && echo "" || echo "LOCAL_HEALTH_FAILED"
      REMOTE

      # 4) ensure the runner user can ssh to localhost (own key)
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
      grep -qF "$(cat ~/.ssh/id_ed25519.pub)" ~/.ssh/authorized_keys 2>/dev/null || cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
      chmod 600 ~/.ssh/authorized_keys

      # 5) start PM2 via ssh so it survives the job (sshd session → init, not runner cgroup)
      ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes localhost "bash '$STABLE/.deploy-remote.sh'"
      echo "Deployed $APP_NAME via ssh-localhost from $STABLE (PM2 detached from runner)."
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
